<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>

    @case ('dashboard') {
      <rect x="3" y="3" width="7" height="9" rx="1.5" />

      <rect x="3" y="16" width="7" height="5" rx="1.5" />

      <path d="M13.7 19a2 2 0 0 1-3.4 0" />

      />
      <path d="m5.2 18.8-2.5 2.5" />
    }
    @case ('calendar') {
      <rect x="3.5" y="5" width="17" height="16" rx="2.5" />
      <path d="M3.5 10h17M8 3v4M16 3v4" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7.5V12l3 1.8" />

    @case ('image') {
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
      <circle cx="9" cy="10" r="1.8" />
      <path d="m4.5 17.5 4.6-4.2a2 2 0 0 1 2.7 0l3.5 3.2" />
      <path d="m14.5 14 1.6-1.4a2 2 0 0 1 2.7 0l1.7 1.5" />

      <path d="m8 8.5 4-4.5 4 4.5" />

      <path d="M14 3.5H7.5A2 2 0 0 0 5.5 5.5v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8Z" />
      <path d="M14 3.5V8h4.5" />
    }
    @case ('check') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="m8.4 12.2 2.4 2.4 4.8-5" />

      <circle cx="12" cy="12" r="8.5" />

    @case ('chevron-down') {
      <path d="m6 9.5 6 6 6-6" />
    }
    @case ('chevron-left') {
      <path d="m14.5 6-6 6 6 6" />
    }
    @case ('chevron-right') {
      <path d="m9.5 6 6 6-6 6" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('close') {
      <path d="m6 6 12 12M18 6 6 18" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />

      <path d="M4 15.5V18a2.5 2.5 0 0 0 2.5 2.5h11A2.5 2.5 0 0 0 20 18v-2.5" />
      <path d="m8 11 4 4.5 4-4.5" />
      <path d="M12 15.5V4" />
    }
    @case ('mail') {
      <rect x="3" y="5" width="18" height="14" rx="2.5" />
      <path d="m3.8 7 7 5.2a2 2 0 0 0 2.4 0l7-5.2" />

    @case ('phone') {
      <path
        d="M21 16.5v2.3a1.8 1.8 0 0 1-2 1.8 17.6 17.6 0 0 1-7.7-2.7 17.3 17.3 0 0 1-5.3-5.3A17.6 17.6 0 0 1 3.4 5a1.8 1.8 0 0 1 1.8-2h2.3a1.8 1.8 0 0 1 1.8 1.6c.1 1 .3 1.9.7 2.8a1.8 1.8 0 0 1-.4 1.9l-1 1a14 14 0 0 0 5.3 5.3l1-1a1.8 1.8 0 0 1 1.9-.4c.9.4 1.8.6 2.8.7A1.8 1.8 0 0 1 21 16.5Z"

      <circle cx="12" cy="12" r="3" />

      <path d="M9.6 5.9A9.4 9.4 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 4" />

      <path d="M10 10a3 3 0 0 0 4 4" />
      <path d="m3.5 3.5 17 17" />

    @case ('building') {
      <path d="M4 20.5V5.5A1.5 1.5 0 0 1 5.5 4h7A1.5 1.5 0 0 1 14 5.5v15" />
      <path d="M14 10h4.5A1.5 1.5 0 0 1 20 11.5v9" />
      <path d="M2.5 20.5h19M7 8h4M7 12h4M7 16h4M17 14h.01M17 17.5h.01" />
    }
    @case ('inbox') {
      <path d="M3.5 12.5h4l1.5 3h6l1.5-3h4" />
      <path
        d="M5.6 5.3 3.5 12.5v5A1.5 1.5 0 0 0 5 19h14a1.5 1.5 0 0 0 1.5-1.5v-5l-2.1-7.2a1.5 1.5 0 0 0-1.4-1.05H7a1.5 1.5 0 0 0-1.4 1.05Z"
      />
    }
    @case ('shield') {
      <path d="M12 21s7-3.2 7-9V5.8L12 3 5 5.8V12c0 5.8 7 9 7 9Z" />
      <path d="m9 12 2 2 4-4" />
    }
  }
</svg>
